[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whisperers"
version = "0.1.0a1"
description = "Find token prefixes that push a language model's internals (a residual direction, attention heads, an SAE latent, a LoRA or a function vector) toward a target."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Soham Padia", email = "sohampadia10@gmail.com" }]
keywords = ["interpretability", "steering", "prompt optimization", "GCG", "function vectors", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.56",
    "accelerate>=0.30",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/soham-padia/whisperers"
Repository = "https://github.com/soham-padia/whisperers"
Issues = "https://github.com/soham-padia/whisperers/issues"

[project.scripts]
whisperers = "whisperers.cli:main"

[project.optional-dependencies]
lora = ["peft>=0.11"]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/whisperers"]
